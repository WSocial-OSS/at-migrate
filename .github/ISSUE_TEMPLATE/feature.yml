name: Feature request
description: A new capability or a change to existing behaviour
title: '[feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. English is the working language of this repository; requests in other languages are welcome.

        Small, self-contained first contributions live in [docs/good-first-issues.md](https://github.com/WSocial-OSS/at-migrate/blob/main/docs/good-first-issues.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful or missing today? Who hits it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? A sketch is enough; maintainers can help with design.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Host directory / registry
        - Migration engine
        - Wizard UI
        - Docs / contributor experience
        - Deployment / operations
        - Something else
      default: 0
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other ways to solve this, or why a workaround is not enough.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I am willing to open a pull request for this
        - label: This does not require live PDS credentials to implement or test
